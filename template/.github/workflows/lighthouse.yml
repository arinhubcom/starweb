# Lighthouse CI for pull requests. Warning only: a low score adds an annotation
# and never fails the job. Never make this a required check. Scores vary
# between runs on shared runners. See Performance in rules/PERF.md.
name: Lighthouse

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/**
      - public/**
      - astro.config.mjs
      - pnpm-lock.yaml
      - lighthouserc.json
      - scripts/report-lighthouse.ts
      - scripts/lib/perf.ts
      - .github/workflows/lighthouse.yml

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro/fonts
          key: fonts-${{ hashFiles('src/lib/fonts.ts', 'pnpm-lock.yaml') }}
          restore-keys: fonts-
      - run: pnpm run build
      - run: pnpm run lighthouse
