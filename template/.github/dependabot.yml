version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 3
    # EmDash moves through Starweb: rules/SETUP.md (EmDash update).
    ignore:
      - dependency-name: "emdash"
      - dependency-name: "@emdash-cms/cloudflare"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "wrangler"
          - "@emdash-cms/*"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Prague"
