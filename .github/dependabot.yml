version: 2
updates:
  # Dependabot uses the value "npm" for pnpm too.
  - package-ecosystem: "npm"
    directory: "/template"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 3
    # scripts/update-starter.mjs moves these with the starter files.
    ignore:
      - dependency-name: "emdash"
      - dependency-name: "@emdash-cms/cloudflare"
    groups:
      stack:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/template"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Prague"
