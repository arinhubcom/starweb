version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/template"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 3
    groups:
      stack:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/template"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Prague"
