name: Template

on:
  push:
    branches: [main]
    paths:
      - "template/**"
      - "scripts/**"
      - "rules/**"
      - ".github/workflows/template.yml"
  pull_request:
    paths:
      - "template/**"
      - "scripts/**"
      - "rules/**"
      - ".github/workflows/template.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: template/files/.nvmrc
      - run: bash scripts/test-template.sh "$RUNNER_TEMP"
      - run: bash scripts/test-update.sh "$RUNNER_TEMP/update"
