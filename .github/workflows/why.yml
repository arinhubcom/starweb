name: WHY

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "WHY.md"
      - "README.md"
      - "TODO.md"
      - "template/package.json"
      - "scripts/check-why*"
      - ".github/workflows/why.yml"
  pull_request:
    paths:
      - "rules/**"
      - "WHY.md"
      - "README.md"
      - "TODO.md"
      - "template/package.json"
      - "scripts/check-why*"
      - ".github/workflows/why.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  why:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: template/.nvmrc
      - run: node --test scripts/check-why.test.mjs
      - run: node scripts/check-why.mjs
